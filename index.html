<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedTest</title>
<style>
  :root {
    --bg-1: #0b1020;
    --bg-2: #101830;
    --accent: #00e0a8;
    --accent-2: #3aa0ff;
    --accent-warm: #ffb648;
    --text: #eaf1ff;
    --text-dim: #8fa0c0;
    --card: rgba(255,255,255,.045);
    --card-border: rgba(255,255,255,.09);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(58,160,255,.18), transparent 60%),
      radial-gradient(800px 500px at 110% 20%, rgba(0,224,168,.12), transparent 55%),
      radial-gradient(700px 700px at 50% 120%, rgba(120,80,255,.14), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ---------- 顶部 ---------- */
  .topbar {
    width: 100%;
    max-width: 980px;
    padding: 22px 28px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: .4px;
  }
  .brand { display:flex; align-items:center; gap:9px; font-weight:700; color:var(--text); font-size:15px; }
  .brand .logo {
    width: 22px; height: 22px; border-radius:6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    color:#06101a; font-size:13px; font-weight:900;
  }
  .topbar .right { display:flex; gap:18px; align-items:center; }
  .topbar .right a { color:var(--text-dim); text-decoration:none; transition:color .2s; }
  .topbar .right a:hover { color:var(--text); }
  .server-pill {
    display:flex; align-items:center; gap:7px;
    border:1px solid var(--card-border); background:var(--card);
    padding:6px 12px; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .server-pill:hover { border-color: rgba(0,224,168,.5); }
  .server-pill .dot {
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 8px var(--accent); animation:pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ---------- 主区 ---------- */
  main {
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; padding:20px 24px 40px;
  }
  .phase-label {
    font-size:12px; letter-spacing:2.5px; color:var(--text-dim);
    text-transform:uppercase; margin-bottom:6px; min-height:16px;
  }
  .phase-label.active { color:var(--accent); }

  .dial {
    position:relative; width:min(280px, 62vw); aspect-ratio:1;
    margin:26px 0 30px; display:flex; align-items:center; justify-content:center;
  }
  .dial svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .dial .track { fill:none; stroke:rgba(255,255,255,.09); stroke-width:7; }
  .dial .ring {
    fill:none; stroke:url(#ringGrad); stroke-width:7; stroke-linecap:round;
    stroke-dasharray: 754; stroke-dashoffset: 754;
    transition: stroke-dashoffset .25s ease-out, stroke .3s;
  }
  .dial .btn {
    width: 58%; aspect-ratio:1; border-radius:50%;
    background: radial-gradient(circle at 50% 35%, #16203c, #0d1426 70%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 30px rgba(0,224,168,.05);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; transition:transform .15s, box-shadow .2s;
  }
  .dial .btn:hover { transform:scale(1.03); box-shadow:0 12px 48px rgba(0,0,0,.6), 0 0 40px rgba(0,224,168,.15); }
  .dial .btn:active { transform:scale(.98); }
  .dial .btn.go { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dial .btn .play {
    width:0; height:0; border-left:22px solid var(--accent); border-top:14px solid transparent; border-bottom:14px solid transparent;
    margin-left:6px; filter:drop-shadow(0 0 10px rgba(0,224,168,.6));
  }
  .dial .btn .lbl { font-size:12px; letter-spacing:2px; color:var(--text-dim); }
  .dial .btn .big {
    display:none; font-size:44px; font-weight:800; letter-spacing:-1px;
    font-variant-numeric: tabular-nums; color:var(--text);
  }
  .dial .btn .unit { display:none; font-size:11px; color:var(--text-dim); letter-spacing:1px; }
  .dial.measuring .btn .go { display:none; }
  .dial.measuring .btn .big, .dial.measuring .btn .unit { display:block; }

  /* ---------- 指标卡 ---------- */
  .stats {
    display:grid; grid-template-columns: repeat(4, 1fr); gap:14px;
    width:100%; max-width: 860px;
  }
  .stat {
    background: var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:18px 16px; text-align:center; transition:transform .2s, border-color .3s;
    backdrop-filter: blur(6px);
  }
  .stat:hover { transform:translateY(-2px); }
  .stat.highlight { border-color: rgba(0,224,168,.45); box-shadow:0 0 24px rgba(0,224,168,.12); }
  .stat .k { font-size:12px; color:var(--text-dim); letter-spacing:1.5px; margin-bottom:10px; }
  .stat .v {
    font-size:30px; font-weight:800; font-variant-numeric:tabular-nums;
    letter-spacing:-.5px; display:flex; align-items:baseline; justify-content:center; gap:4px;
  }
  .stat .v small { font-size:13px; font-weight:500; color:var(--text-dim); }
  .stat .v .status { font-size:15px; font-weight:600; color:var(--text-dim); }
  .stat .bar { margin-top:12px; height:4px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; }
  .stat .bar i {
    display:block; height:100%; width:0; border-radius:2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .2s linear;
  }

  /* ---------- 底部 ---------- */
  footer {
    width:100%; text-align:center; padding:18px 0 26px;
    font-size:12px; color:var(--text-dim); letter-spacing:.3px;
  }
  footer .hint { margin-top:6px; font-size:11px; opacity:.75; }
  .tag { display:inline-block; margin-top:8px; padding:3px 10px; border-radius:999px; border:1px dashed rgba(143,160,192,.4); font-size:11px; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .topbar .right a { display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">S</div>
    <span>SpeedTest UI</span>
  </div>
  <div class="right">
    <a href="#">服务器</a>
    <a href="#">历史记录</a>
    <a href="#">设置</a>
    <div class="server-pill"><span class="dot"></span><span>苏州 · 电信 (12ms)</span></div>
  </div>
</div>

<main>
  <div class="phase-label" id="phaseLabel">点击开始测速</div>

  <div class="dial" id="dial">
    <svg viewBox="0 0 260 260">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00e0a8"/>
          <stop offset="100%" stop-color="#3aa0ff"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="130" cy="130" r="120"/>
      <circle class="ring" id="ring" cx="130" cy="130" r="120"/>
    </svg>
    <div class="btn" id="btn">
      <div class="go">
        <div class="play"></div>
        <div class="lbl">测 试</div>
      </div>
      <div class="big" id="bigNum">0</div>
      <div class="unit" id="bigUnit">Mbps</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat" id="s-ping">
      <div class="k">PING</div>
      <div class="v"><span class="status" data-v="—">—</span></div>
    </div>
    <div class="stat" id="s-dl">
      <div class="k">下载速度</div>
      <div class="v"><span class="status" data-v="—">—</span><small>Mbps</small></div>
      <div class="bar"><i></i></div>
    </div>
    <div class="stat" id="s-ul">
      <div class="k">上传速度</div>
      <div class="v"><span class="status" data-v="—">—</span><small>Mbps</small></div>
      <div class="bar"><i></i></div>
    </div>
    <div class="stat" id="s-jit">
      <div class="k">抖动</div>
      <div class="v"><span class="status" data-v="—">—</span></div>
    </div>
  </div>
</main>

<footer>
  网络性能测试
  <div class="hint">点击中央按钮体验完整测速</div>
  <span class="tag">UI Demo</span>
</footer>

<script>
(() => {
  const dial = document.getElementById('dial');
  const btn = document.getElementById('btn');
  const ring = document.getElementById('ring');
  const phaseLabel = document.getElementById('phaseLabel');
  const bigNum = document.getElementById('bigNum');
  const bigUnit = document.getElementById('bigUnit');
  const CIRC = 2 * Math.PI * 120; // ≈754

  const stats = {
    ping:  { el: document.getElementById('s-ping'),  val: null },
    dl:    { el: document.getElementById('s-dl'),    val: null },
    ul:    { el: document.getElementById('s-ul'),    val: null },
    jit:   { el: document.getElementById('s-jit'),   val: null },
  };

  let running = false;
  let raf = null;

  function setRing(p) { ring.style.strokeDashoffset = CIRC * (1 - Math.max(0, Math.min(1, p))); }

  function setStat(key, text) {
    const st = stats[key];
    if (!st) return;
    const span = st.el.querySelector('.status');
    span.textContent = text;
    st.el.classList.add('highlight');
    setTimeout(() => st.el.classList.remove('highlight'), 1600);
  }

  function setBig(v, unit) {
    bigNum.textContent = v.toFixed(1);
    bigUnit.textContent = unit;
  }

  // 模拟一帧速度
  function animateValue(elm, from, to, dur, cb) {
    const t0 = performance.now();
    function frame(t) {
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      elm.textContent = (from + (to - from) * eased).toFixed(1);
      if (p < 1) requestAnimationFrame(frame);
      else cb && cb();
    }
    requestAnimationFrame(frame);
  }

  function setBar(key, pct) { stats[key].el.querySelector('.bar i').style.width = (pct*100) + '%'; }

  function phase(text, color) {
    phaseLabel.textContent = text;
    phaseLabel.classList.add('active');
    phaseLabel.style.color = color || 'var(--accent)';
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // 阶段1: Ping
  async function runPing() {
    phase('正在测 Ping …');
    setBig(0, 'ms');
    const start = performance.now();
    let elapsed = 0;
    while (elapsed < 1200) {
      elapsed = performance.now() - start;
      setRing(elapsed / 1200);
      await sleep(30);
    }
    const ping = (8 + Math.random() * 16).toFixed(0);
    setStat('ping', ping + ' ms');
    setBig(Number(ping), 'ms');
    setRing(1);
    await sleep(450);
  }

  // 阶段2: 下载
  async function runDownload() {
    phase('正在测下载速度 …', 'var(--accent)');
    setBig(0, 'Mbps');
    const target = 320 + Math.random() * 160; // 320~480 Mbps
    const dur = 2400;
    const t0 = performance.now();
    let v = 0;
    while (true) {
      const p = Math.min(1, (performance.now() - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 2.4);
      v = Math.min(target, target * eased);
      setBig(v, 'Mbps');
      setRing(p);
      setBar('dl', p);
      if (p >= 1) break;
      await sleep(30);
    }
    const final = target + Math.random() * 40;
    animateValue(bigNum, v, final, 600);
    setStat('dl', final.toFixed(1));
    await sleep(500);
  }

  // 阶段3: 上传
  async function runUpload() {
    phase('正在测上传速度 …', 'var(--accent-2)');
    setBig(0, 'Mbps');
    const target = 60 + Math.random() * 50; // 60~110 Mbps
    const dur = 2200;
    const t0 = performance.now();
    let v = 0;
    while (true) {
      const p = Math.min(1, (performance.now() - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 2.2);
      v = Math.min(target, target * eased);
      setBig(v, 'Mbps');
      setRing(p);
      setBar('ul', p);
      if (p >= 1) break;
      await sleep(30);
    }
    const final = target + Math.random() * 20;
    animateValue(bigNum, v, final, 600);
    setStat('ul', final.toFixed(1));
    setRing(1);
    await sleep(400);
  }

  // 阶段4: 抖动
  async function runJitter() {
    phase('正在分析结果 …');
    const samples = [];
    for (let i = 0; i < 8; i++) {
      samples.push(2 + Math.random() * 8);
      await sleep(160);
    }
    const jit = samples.reduce((a,b)=>a+b,0)/samples.length;
    setStat('jit', jit.toFixed(1) + ' ms');
    setBig(jit, 'ms');
  }

  async function start() {
    if (running) return;
    running = true;
    dial.classList.add('measuring');
    ring.style.stroke = 'url(#ringGrad)';
    Object.values(stats).forEach(s => {
      s.el.querySelector('.status').textContent = '—';
      const bar = s.el.querySelector('.bar i');
      if (bar) bar.style.width = '0';
    });

    await runPing();
    await runDownload();
    await runUpload();
    await runJitter();

    phase('测速完成', 'var(--accent)');
    await sleep(900);
    dial.classList.remove('measuring');
    setRing(0);
    setBig(0, 'Mbps');
    phaseLabel.textContent = '点击开始测速';
    phaseLabel.classList.remove('active');
    running = false;
  }

  btn.addEventListener('click', start);
})();
</script>
</body>
</html>
